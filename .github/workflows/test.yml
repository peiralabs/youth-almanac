name: Tests

# Deliberately separate from refresh.yml: that one reaches out to live library
# calendars, so it is slow and can fail for reasons that have nothing to do
# with the change under review. This runs offline against committed data.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # python3 and node are both preinstalled on the runner; node is what the
      # template-guard test uses to execute the regex the tool actually ships.
      - run: python3 -m unittest discover -s tests -v
      - run: python3 build/validate.py
