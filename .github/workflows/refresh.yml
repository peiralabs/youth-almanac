name: Refresh listings

on:
  schedule:
    - cron: '17 9 * * 1'      # Mondays, 09:17 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - 'registry/**'
      - 'build/**'
      - 'src/**'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch listings
        run: python3 build/fetch_events.py

      - name: Validate
        run: python3 build/validate.py

      - name: Build tool
        run: python3 build/make_tool.py

      # A pull request proves the change builds; it must not rewrite the
      # published artefact from a fork.
      - name: Commit refreshed data
        if: github.event_name != 'pull_request'
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add build/data dist
          if git diff --cached --quiet; then
            echo 'nothing changed'
          else
            git commit -m "chore: refresh listings $(date -u +%Y-%m-%d)"
            git push
          fi
